<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efe8d8" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Optima", "Candara", "Trebuchet MS", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(900px 600px at 10% -10%, rgba(199, 139, 91, 0.25), transparent 60%),
          radial-gradient(760px 560px at 90% -5%, rgba(47, 111, 78, 0.22), transparent 55%),
          linear-gradient(180deg, #f4efe4, #e7dcc7);
        color: #1c2521;
      }
      .card {
        width: min(520px, 90vw);
        background: rgba(255, 255, 255, 0.92);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 60px rgba(33, 24, 10, 0.22);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Georgia", serif;
        font-size: 1.9rem;
      }
      p {
        margin: 0 0 16px;
        color: #5a6a60;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        background: linear-gradient(140deg, #2f6f4e, #1f4d36);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>The app is not available right now. Check your connection and try again.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
